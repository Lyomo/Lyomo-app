<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>LÖMO — Видео</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16a34a">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png" type="image/png">
</head>
<body>
  <div class="layout">
    <nav class="sidebar" id="sidebarRoot"></nav>

    <div class="app">
      <header id="headerRoot"></header>

      <section>
        <h2>Видео</h2>
        <p class="muted">Добавляй фильмы, сериалы, клипы или ссылки на видео.</p>

        <div class="media-form">
          <input id="videoInput" placeholder="Название или ссылка на видео..." />
          <button id="videoAdd" class="btn primary">Добавить</button>
        </div>

        <ul id="videoList" class="media-list"></ul>
      </section>
    </div>
  </div>

  <div id="footerRoot"></div>

  <script src="components.js"></script>
  <script src="app.js"></script>
</body>
</html>
