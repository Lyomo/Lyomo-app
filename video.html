<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>LÖMO — Видео</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16a34a">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png" type="image/png">
</head>
<body>
  <div class="layout">
    <nav class="sidebar" id="sidebarRoot"></nav>

    <div class="app">
      <header id="headerRoot"></header>

      <section>
        <p class="muted">Загружай свои видео или добавляй ссылки на YouTube.</p>

        <div class="media-upload-row">
          <label class="btn primary custom-file-upload mobile-fab-trigger">
            <input type="file" id="videoFileInput" accept="video/*" hidden>
            <span class="btn-label">Загрузить видео</span>
            <span class="fab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5v15M4.5 12h15"/></svg></span>
          </label>
          <button type="button" id="videoAddLinkBtn" class="btn">Добавить по ссылке</button>
        </div>

        <div id="videoUploadForm" class="media-add-form" hidden>
          <input id="videoTitleInput" placeholder="Название видео">
          <div class="media-add-form-actions">
            <button id="videoConfirmUpload" class="btn primary">Загрузить</button>
            <button id="videoCancelUpload" class="btn">Отмена</button>
          </div>
        </div>

        <div id="videoLinkForm" class="media-add-form" hidden>
          <input id="videoLinkInput" placeholder="Ссылка на видео (например, YouTube)">
          <input id="videoLinkTitleInput" placeholder="Название (необязательно)">
          <div class="media-add-form-actions">
            <button id="videoConfirmLink" class="btn primary">Добавить</button>
            <button id="videoCancelLink" class="btn">Отмена</button>
          </div>
        </div>

        <div id="videoList" class="video-grid"></div>
      </section>
    </div>
  </div>

  <div id="footerRoot"></div>

  <script src="components.js"></script>
  <script src="app.js"></script>
</body>
</html>
