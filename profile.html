<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>LÖMO — Профиль</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16a34a">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png" type="image/png">
</head>
<body>
  <div class="layout">
    <nav class="sidebar" id="sidebarRoot"></nav>

    <div class="app">
      <header id="headerRoot"></header>

      <section class="profile-card" style="margin-bottom:16px;">
        <div class="profile-avatar-wrap">
          <img id="profileViewAvatar" class="profile-avatar" src="" alt="Аватар" style="display:none;">
        </div>
        <div class="profile-info">
          <div id="profileViewName" class="profile-name">…</div>
          <div class="meta" style="margin-top:8px;">ID пользователя:</div>
          <div id="profileViewId" class="profile-about"></div>
          <div id="profileViewAboutLabel" class="meta" style="margin-top:8px;" hidden>О себе:</div>
          <div id="profileViewAbout" class="profile-about" hidden></div>
        </div>
        <div id="profileFriendAction" style="margin-top:12px;display:flex;gap:8px;"></div>
      </section>

      <section>
        <h2>Стена</h2>
        <div id="wallSection" class="wall"></div>
      </section>
    </div>
  </div>

  <div id="footerRoot"></div>

  <script src="components.js"></script>
  <script src="app.js"></script>
</body>
</html>
