<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>LÖMO — Вход</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16a34a">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png" type="image/png">
</head>
<body>
  <div class="auth-shell">
    <header class="auth-shell-header">
      <div class="sidebar-logo">
        <div class="logo-circle" style="cursor:default;">LÖ</div>
        <div>
          <div class="logo-title">LÖMO</div>
          <div class="logo-sub">твоя соц-песочница</div>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="darkToggle">
        <span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.3A8.4 8.4 0 1 1 9.7 4a7 7 0 0 0 10.3 10.3Z"/></svg></span>
      </label>
    </header>

    <section class="auth-page">
      <div class="auth-card">
        <div class="tabs" id="authTabs">
          <button type="button" class="tab-btn active" data-tab="login">Вход</button>
          <button type="button" class="tab-btn" data-tab="register">Регистрация</button>
        </div>

        <div id="authError" class="auth-error" hidden></div>

        <form id="loginPanel" class="auth-panel" novalidate>
          <label>
            <div class="meta">Логин</div>
            <input id="loginLogin" placeholder="Логин" autocomplete="username">
          </label>
          <label>
            <div class="meta">Пароль</div>
            <div class="password-field">
              <input id="loginPassword" type="password" placeholder="Пароль" autocomplete="current-password">
              <button type="button" class="password-toggle-btn" data-target="loginPassword" aria-label="Показать пароль">
                <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M9.9 5.2A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.2 4.1M6.5 6.6C4 8.3 2 12 2 12a15.7 15.7 0 0 0 5 5.6c1.4.9 3 1.4 5 1.4 1 0 1.9-.1 2.8-.4"/><path d="M9.9 14.1a3.2 3.2 0 0 1-.3-1.4 3.2 3.2 0 0 1 3.2-3.2c.5 0 1 .1 1.4.3"/></svg>
              </button>
            </div>
          </label>
          <button type="submit" id="loginBtn" class="btn primary">Войти</button>
        </form>

        <form id="registerPanel" class="auth-panel" hidden novalidate>
          <!-- Honeypot против простых ботов: невидимо для человека (off-screen,
               не через display/hidden — часть ботов проверяет именно эти два
               признака), tabindex=-1 не даёт попасть сюда табом, autocomplete=off
               не даёт браузеру подставить туда что-то само. Реальный пользователь
               никогда это поле не увидит и не заполнит — заполнено оно только у
               бота, который слепо заполняет все поля формы. Сервер (server.js,
               /api/register) молча отбивает запрос, если оно не пустое. -->
          <div class="hp-field" aria-hidden="true">
            <label for="regWebsite">Оставь это поле пустым</label>
            <input type="text" id="regWebsite" name="website" tabindex="-1" autocomplete="off">
          </div>
          <div class="auth-name-row">
            <label>
              <div class="meta">Имя</div>
              <input id="regFirstName" placeholder="Имя" autocomplete="given-name">
            </label>
            <label>
              <div class="meta">Фамилия</div>
              <input id="regLastName" placeholder="Фамилия" autocomplete="family-name">
            </label>
          </div>
          <label>
            <div class="meta">Дата рождения</div>
            <input id="regBirthDate" type="date" autocomplete="bday">
            <div id="regBirthDateHint" class="field-hint">Нужно быть старше 13 лет</div>
          </label>
          <label>
            <div class="meta">Логин</div>
            <input id="regLogin" placeholder="Придумай логин" autocomplete="username">
            <div id="regLoginHint" class="field-hint">Латиница, цифры, точка или подчёркивание — без пробелов</div>
          </label>
          <label>
            <div class="meta">Пароль</div>
            <div class="password-field">
              <input id="regPassword" type="password" placeholder="Минимум 6 символов" autocomplete="new-password">
              <button type="button" class="password-toggle-btn" data-target="regPassword" aria-label="Показать пароль">
                <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M9.9 5.2A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.2 4.1M6.5 6.6C4 8.3 2 12 2 12a15.7 15.7 0 0 0 5 5.6c1.4.9 3 1.4 5 1.4 1 0 1.9-.1 2.8-.4"/><path d="M9.9 14.1a3.2 3.2 0 0 1-.3-1.4 3.2 3.2 0 0 1 3.2-3.2c.5 0 1 .1 1.4.3"/></svg>
              </button>
            </div>
            <div id="regPasswordLengthHint" class="field-hint">Минимум 6 символов</div>
          </label>
          <label>
            <div class="meta">Повтор пароля</div>
            <div class="password-field">
              <input id="regPassword2" type="password" placeholder="Повтори пароль" autocomplete="new-password">
              <button type="button" class="password-toggle-btn" data-target="regPassword2" aria-label="Показать пароль">
                <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M9.9 5.2A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.2 4.1M6.5 6.6C4 8.3 2 12 2 12a15.7 15.7 0 0 0 5 5.6c1.4.9 3 1.4 5 1.4 1 0 1.9-.1 2.8-.4"/><path d="M9.9 14.1a3.2 3.2 0 0 1-.3-1.4 3.2 3.2 0 0 1 3.2-3.2c.5 0 1 .1 1.4.3"/></svg>
              </button>
            </div>
            <div id="regPasswordMatchHint" class="field-hint"></div>
          </label>
          <div class="auth-note">Восстановление пароля пока недоступно — почта или телефон не привязываются. Обязательно запомни пароль.</div>
          <label class="auth-consent">
            <input type="checkbox" id="regAgreeTerms">
            <span>Я принимаю <button type="button" id="openTermsBtn" class="link-btn">пользовательское соглашение</button></span>
          </label>
          <button type="submit" id="regBtn" class="btn primary">Создать аккаунт</button>
        </form>
      </div>
    </section>
  </div>

  <div id="toastContainer"></div>
  <audio id="notifySound" src="Gingle.WAV" preload="auto"></audio>

  <script src="app.js"></script>
</body>
</html>
