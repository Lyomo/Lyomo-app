<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>LÖMO — Книги</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16a34a">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png" type="image/png">
</head>
<body>
  <div class="layout">
    <nav class="sidebar" id="sidebarRoot"></nav>

    <div class="app">
      <header id="headerRoot"></header>

      <section>
        <p class="muted">Твоя личная библиотека для чтения.</p>

        <button type="button" id="bookAddBtn" class="btn primary mobile-fab-trigger">
          <span class="btn-label">+ Добавить книгу</span>
          <span class="fab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5v15M4.5 12h15"/></svg></span>
        </button>

        <div id="bookAddForm" class="media-add-form" hidden>
          <input id="bookTitleInput" placeholder="Название">
          <input id="bookAuthorInput" placeholder="Автор (необязательно)">
          <input id="bookCoverInput" placeholder="Ссылка на обложку (необязательно)">
          <input id="bookLinkInput" placeholder="Ссылка для чтения (необязательно)">
          <div class="media-add-form-actions">
            <button id="bookConfirmAdd" class="btn primary">Добавить</button>
            <button id="bookCancelAdd" class="btn">Отмена</button>
          </div>
        </div>

        <div class="tabs" id="booksTabs">
          <button type="button" class="tab-btn active" data-status="want">Хочу прочитать</button>
          <button type="button" class="tab-btn" data-status="reading">Читаю</button>
          <button type="button" class="tab-btn" data-status="done">Прочитано</button>
        </div>
        <div id="bookList" class="book-grid"></div>
      </section>
    </div>
  </div>

  <div id="footerRoot"></div>

  <script src="components.js"></script>
  <script src="app.js"></script>
</body>
</html>
