<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>LÖMO — Группа</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16a34a">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png" type="image/png">
</head>
<body>
  <div class="layout">
    <nav class="sidebar" id="sidebarRoot"></nav>

    <div class="app">
      <header id="headerRoot"></header>

      <section class="profile-card" style="margin-bottom:16px;">
        <div class="profile-avatar-wrap">
          <div id="groupViewAvatar" class="avatar-edit-preview" style="width:96px;height:96px;font-size:32px;margin:0 auto;"></div>
        </div>
        <h2 id="groupViewName">Группа</h2>
        <p id="groupViewDescription" class="profile-about"></p>
        <div style="display:flex;align-items:center;gap:8px;">
          <span id="groupViewCategory" class="chip"></span>
          <p id="groupViewMembers" class="muted" style="margin:0;"></p>
        </div>
        <div id="groupActions" style="margin-top:8px;display:flex;gap:8px;"></div>
      </section>

      <section>
        <h2>Стена группы</h2>
        <div id="wallSection" class="wall"></div>
      </section>
    </div>
  </div>

  <div id="footerRoot"></div>

  <script src="components.js"></script>
  <script src="app.js"></script>
</body>
</html>
