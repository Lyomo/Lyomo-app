<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>LÖMO — Группа</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16a34a">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png" type="image/png">
</head>
<body>
  <div class="layout">
    <nav class="sidebar" id="sidebarRoot"></nav>

    <div class="app">
      <header id="headerRoot"></header>

      <section class="profile-card" style="margin-bottom:16px;">

        <p id="groupViewMembers" class="muted"></p>
        <div id="groupActions" style="margin-top:8px;display:flex;gap:8px;"></div>

      <section>
        <h2>Стена группы</h2>
        <div id="wallSection" class="wall"></div>
      </section>
    </div>
  </div>

  <div id="footerRoot"></div>

  <script src="components.js"></script>
  <script src="app.js"></script>
</body>
</html>
