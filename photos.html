<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>LÖMO — Фото</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16a34a">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png" type="image/png">
</head>
<body>
  <div class="layout">
    <nav class="sidebar" id="sidebarRoot"></nav>

    <div class="app">
      <header id="headerRoot"></header>

      <section>
        <h2>Мои альбомы</h2>
        <div class="media-upload-row">
          <input id="albumTitleInput" placeholder="Название альбома" />
          <button id="albumCreateBtn" class="btn primary mobile-fab-trigger">
            <span class="btn-label">Создать альбом</span>
            <span class="fab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5v15M4.5 12h15"/></svg></span>
          </button>
        </div>
        <div id="albumsList" class="album-list"></div>
      </section>

      <section id="albumPhotosSection" hidden>
        <h2 id="currentAlbumTitle"></h2>
        <div class="media-upload-row">
          <label class="btn primary custom-file-upload">
            <input type="file" id="photoFileInput" accept="image/*" hidden>
            Загрузить фото
          </label>
        </div>
        <div id="photoGrid" class="photo-grid"></div>
      </section>
      <div id="noAlbumsHint"></div>
    </div>
  </div>

  <div id="footerRoot"></div>

  <script src="components.js"></script>
  <script src="app.js"></script>
</body>
</html>
