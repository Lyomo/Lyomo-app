<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>LÖMO — Группы</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16a34a">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png" type="image/png">
</head>
<body>
  <div class="layout">
    <nav class="sidebar" id="sidebarRoot"></nav>

    <div class="app">
      <header id="headerRoot"></header>

      <section>
        <h2>Группы</h2>

        <div class="media-form">
          <input id="groupNameInput" placeholder="Название группы" />
          <input id="groupDescInput" placeholder="Описание (необязательно)" />
          <button id="groupCreateBtn" class="btn primary">Создать</button>
        </div>

        <div id="groupsList" class="group-list"></div>
      </section>
    </div>
  </div>

  <div id="footerRoot"></div>

  <script src="components.js"></script>
  <script src="app.js"></script>
</body>
</html>
