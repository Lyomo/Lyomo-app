<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>LÖMO — Группы</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16a34a">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png" type="image/png">
</head>
<body>
  <div class="layout">
    <nav class="sidebar" id="sidebarRoot"></nav>

    <div class="app">
      <header id="headerRoot"></header>

      <section>
        <div class="groups-toolbar-top">
          <button type="button" id="groupCreateBtn" class="btn primary mobile-fab-trigger">
            <span class="btn-label">+ Создать группу</span>
            <span class="fab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5v15M4.5 12h15"/></svg></span>
          </button>
        </div>

        <div class="groups-search-row">
          <input id="groupSearchInput" placeholder="Поиск по названию или описанию">
          <button type="button" id="groupSearchBtn" class="btn">Найти</button>
        </div>

        <div class="tabs" id="groupsScopeTabs">
          <button type="button" class="tab-btn active" data-scope="all">Все группы</button>
          <button type="button" class="tab-btn" data-scope="mine">Мои группы</button>
        </div>

        <div class="groups-filter-row">
          <div class="chip-row" id="groupCategoryChips">
            <button type="button" class="chip active" data-category="all">Все</button>
            <button type="button" class="chip" data-category="it">IT и разработка</button>
            <button type="button" class="chip" data-category="fun">Развлечения</button>
            <button type="button" class="chip" data-category="games">Игры</button>
            <button type="button" class="chip" data-category="education">Образование</button>
            <button type="button" class="chip" data-category="music">Музыка</button>
            <button type="button" class="chip" data-category="movies">Кино</button>
            <button type="button" class="chip" data-category="other">Разное</button>
          </div>
          <select id="groupSortSelect">
            <option value="popular">По популярности</option>
            <option value="new">Сначала новые</option>
          </select>
        </div>

        <div id="groupsList" class="group-list"></div>
      </section>
    </div>
  </div>

  <div id="footerRoot"></div>

  <script src="components.js"></script>
  <script src="app.js"></script>
</body>
</html>
