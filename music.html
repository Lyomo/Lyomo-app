<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>LÖMO — Музыка</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16a34a">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png" type="image/png">
</head>
<body>
  <div class="layout">
    <nav class="sidebar" id="sidebarRoot"></nav>

    <div class="app">
      <header id="headerRoot"></header>

      <section>
        <h2>Музыка</h2>
        <p class="muted">Твои треки — загружай и слушай прямо здесь.</p>

        <div class="media-upload-row">
          <label id="musicUploadTrigger" class="btn primary custom-file-upload mobile-fab-trigger">
            <input type="file" id="musicFileInput" accept="audio/*" hidden>
            <span class="btn-label">Загрузить трек</span>
            <span class="fab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5v15M4.5 12h15"/></svg></span>
          </label>
        </div>

        <div id="musicAddForm" class="media-add-form" hidden>
          <input id="musicTitleInput" placeholder="Название трека">
          <input id="musicArtistInput" placeholder="Исполнитель (необязательно)">
          <div class="media-add-form-actions">
            <button id="musicConfirmAdd" class="btn primary">Добавить</button>
            <button id="musicCancelAdd" class="btn">Отмена</button>
          </div>
        </div>

        <div id="musicList" class="track-list"></div>
      </section>

      <div id="musicPlayerBar" class="mini-player" hidden>
        <button type="button" id="musicPlayerToggle" class="mini-player-toggle"></button>
        <div class="mini-player-info">
          <div id="musicPlayerTitle" class="mini-player-title"></div>
          <div id="musicPlayerArtist" class="mini-player-artist meta"></div>
        </div>
        <audio id="musicAudioEl"></audio>
      </div>
    </div>
  </div>

  <div id="footerRoot"></div>

  <script src="components.js"></script>
  <script src="app.js"></script>
</body>
</html>
